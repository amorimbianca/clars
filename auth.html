<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLAR’S | Login & Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Dedicated Auth Page Styles */
        .auth-body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 10% 10%, #fff 0%, #f9ebef 100%);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Decorative Bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(225, 151, 165, 0.1);
            z-index: 0;
            pointer-events: none;
        }

        .auth-card {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            box-shadow: 0 40px 100px rgba(60, 21, 33, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.8);
            z-index: 10;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Left Side: Form */
        .auth-form-side {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-logo-circle {
            width: 50px;
            height: 50px;
            border: 3px solid var(--color-pink-accent);
            border-radius: 50%;
            margin-bottom: 30px;
        }

        .auth-title-row {
            margin-bottom: 40px;
        }

        .auth-title-row h2 {
            font-size: 1.8rem;
            color: var(--color-wine);
            font-family: var(--font-main);
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: #fff;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-pink-accent);
            box-shadow: 0 5px 15px rgba(225, 151, 165, 0.1);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--color-wine);
            font-weight: 600;
        }

        .btn-auth-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #E197A5, #F2D5DD, #FF8A65);
            background-size: 200% auto;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.5s;
            box-shadow: 0 10px 25px rgba(225, 151, 165, 0.3);
            margin-bottom: 30px;
        }

        .btn-auth-submit:hover {
            background-position: right center;
            transform: translateY(-2px);
        }

        .social-divider {
            text-align: center;
            position: relative;
            margin-bottom: 25px;
            color: #aaa;
            font-size: 0.85rem;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
            background: #fff;
            color: var(--color-wine);
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .social-btn:hover {
            border-color: var(--color-pink-accent);
            transform: scale(1.1);
            color: var(--color-pink-accent);
        }

        .switch-auth {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        .switch-auth a {
            color: var(--color-wine);
            font-weight: 700;
        }

        /* Right Side: Visual */
        .auth-visual-side {
            background: linear-gradient(135deg, #A78BFA 0%, #E197A5 50%, #FF8A65 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 60px;
            color: #fff;
        }

        .visual-circle-overlay {
            position: absolute;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            border-radius: 50%;
        }

        .visual-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .visual-content h1 {
            font-size: 5rem;
            font-family: var(--font-main);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .visual-content p {
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.9;
            max-width: 400px;
            margin: 0 auto 40px;
        }

        .btn-learn-more {
            padding: 12px 35px;
            background: #fff;
            color: var(--color-pink-accent);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-learn-more:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .play-btn-outline {
            width: 45px;
            height: 45px;
            border: 2px solid #fff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            vertical-align: middle;
        }

        /* Responsive Auth */
        @media (max-width: 850px) {
            .auth-card { grid-template-columns: 1fr; }
            .auth-visual-side { display: none; }
            .auth-form-side { padding: 40px; }
        }
    </style>
</head>
<body class="auth-body">
    <!-- Animated Bubbles -->
    <div class="bubble" style="width: 200px; height: 200px; top: -50px; left: -50px;"></div>
    <div class="bubble" style="width: 150px; height: 150px; bottom: 10%; right: 5%;"></div>
    <div class="bubble" style="width: 80px; height: 80px; top: 40%; left: 10%;"></div>

    <div class="auth-card">
        <!-- Left Section -->
        <div class="auth-form-side">
            <div class="auth-logo-circle"></div>
            
            <div class="auth-title-row">
                <h2>Login / Cadastro na CLAR’S</h2>
            </div>

            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Endereço de E-mail:</label>
                    <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#" class="forgot-pass">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-auth-submit">Entrar</button>

                <div class="social-divider">ou conecte-se com</div>

                <div class="social-icons">
                    <a href="#" class="social-btn"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-google"></i></a>
                </div>

                <div class="switch-auth">
                    Ainda não tem uma conta? <a href="#">Cadastre-se</a>
                </div>
            </form>
        </div>

        <!-- Right Section -->
        <div class="auth-visual-side">
            <div class="visual-circle-overlay"></div>
            <div class="visual-content">
                <h1>CLAR’S</h1>
                <p>Onde cada detalhe conta uma história de brilho e exclusividade. Descubra a perfeição em cada peça.</p>
                <div class="visual-actions">
                    <button class="btn-learn-more">Saiba Mais</button>
                    <div class="play-btn-outline"><i class="fas fa-play"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Bubble Floating Animation
        document.querySelectorAll('.bubble').forEach((bubble, index) => {
            const delay = index * 2;
            const duration = 15 + index * 5;
            bubble.style.animation = `floatingBubble ${duration}s ease-in-out infinite alternate`;
            bubble.style.animationDelay = `${delay}s`;
        });

        // Simple form handling
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Acesso simulado com sucesso! Bem-vindo à CLAR’S.');
            window.location.href = 'index.html';
        });
    </script>

    <style>
        @keyframes floatingBubble {
            from { transform: translate(0, 0); }
            to { transform: translate(30px, -50px); }
        }
    </style>
</body>
</html>
